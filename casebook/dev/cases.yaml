- id: dev-17-missing-ledger
  note: The billed connector failed. The run is incomplete and produces no finding that depends on the billed ledger.
  now: "2026-11-04T02:00:00Z"
  ledgers:
    intended: [{row: i1, key: "i-0aa1"}]
    observed: [{row: o1, key: "i-0aa1", ts: "2026-10-01T00:00:00Z"}, {row: o2, key: "i-0f3e", ts: "2026-11-01T00:00:00Z"}]
    billed: null
  expect:
    complete: false
    missing_ledgers: [billed]
    findings: 0

- id: dev-18-scope-filter
  note: Records tagged outside the audited scope are dropped before matching and counted.
  now: "2026-11-04T02:00:00Z"
  control: {scope: {attr: "project", equals: "lab"}}
  ledgers:
    intended: [{row: i1, key: "i-0aa1", attrs: {project: lab}}]
    observed: [{row: o1, key: "i-0aa1", ts: "2026-10-01T00:00:00Z", attrs: {project: lab}}, {row: o2, key: "i-0cc9", ts: "2026-10-01T00:00:00Z", attrs: {project: other}}]
    billed: [{row: b1, key: "arn:aws:ec2:us-east-1:111122223333:instance/i-0aa1", amount: "3.10", attrs: {project: lab}}, {row: b2, key: "arn:aws:ec2:us-east-1:111122223333:instance/i-0cc9", amount: "3.10", attrs: {project: other}}]
  expect:
    regions: {i-0aa1: IOB}
    dropped: {intended: 0, observed: 1, billed: 1}
    findings: 0
    billed_total: "3.10"
