# Night Audit casebook: development set.
# Written by hand before any matcher code existed. Each case states the three ledgers and the expected outcome.
# Timestamps are UTC. "now" is the run time. Amounts are decimal strings.
# Default control for every case unless the case overrides it:
#   normalisers: intended [strip, lower]; observed [strip, lower]; billed [arn_resource_id, strip, lower]
#   grace_hours: 24
#   people cases use [email_canonical] on all three ledgers with alias_domains {hollowpines.org: hollowpines.com}

- id: dev-01-healthy-account
  note: Three matched resources. A healthy control must produce nothing.
  now: "2026-11-04T02:00:00Z"
  ledgers:
    intended: [{row: i1, key: "i-0aa1"}, {row: i2, key: "vol-0bb2"}, {row: i3, key: "lab-logs-bucket"}]
    observed: [{row: o1, key: "i-0aa1", ts: "2026-10-01T00:00:00Z"}, {row: o2, key: "vol-0bb2", ts: "2026-10-01T00:00:00Z"}, {row: o3, key: "lab-logs-bucket", ts: "2026-10-01T00:00:00Z"}]
    billed: [{row: b1, key: "arn:aws:ec2:us-east-1:111122223333:instance/i-0aa1", amount: "3.10"}, {row: b2, key: "arn:aws:ec2:us-east-1:111122223333:volume/vol-0bb2", amount: "0.80"}, {row: b3, key: "lab-logs-bucket", amount: "0.02"}]
  expect:
    regions: {i-0aa1: IOB, vol-0bb2: IOB, lab-logs-bucket: IOB}
    findings: 0
    billed_total: "3.92"

- id: dev-02-vampire-unapproved-instance
  note: An instance nobody approved, running and billed in a region the team never uses.
  now: "2026-11-04T02:00:00Z"
  ledgers:
    intended: [{row: i1, key: "i-0aa1"}]
    observed: [{row: o1, key: "i-0aa1", ts: "2026-10-01T00:00:00Z"}, {row: o2, key: "i-0f3e", ts: "2026-11-02T21:14:00Z"}]
    billed: [{row: b1, key: "arn:aws:ec2:us-east-1:111122223333:instance/i-0aa1", amount: "3.10"}, {row: b2, key: "arn:aws:ec2:sa-east-1:111122223333:instance/i-0f3e", amount: "41.20"}]
  expect:
    regions: {i-0aa1: IOB, i-0f3e: OB}
    findings: 1
    billed_by_region: {IOB: "3.10", OB: "41.20"}
    billed_total: "44.30"

- id: dev-03-poltergeist-undeclared-access-key
  note: An access key exists, is not declared, and costs nothing.
  now: "2026-11-04T02:00:00Z"
  ledgers:
    intended: [{row: i1, key: "AKIAEXAMPLEDECLARED1"}]
    observed: [{row: o1, key: "AKIAEXAMPLEDECLARED1", ts: "2026-06-01T00:00:00Z"}, {row: o2, key: "AKIAEXAMPLEUNKNOWN99", ts: "2026-03-11T00:00:00Z"}]
    billed: []
  control: {normalisers: {intended: [strip], observed: [strip], billed: [strip]}}
  expect:
    regions: {AKIAEXAMPLEDECLARED1: IO, AKIAEXAMPLEUNKNOWN99: O}
    findings: 1
    informational: 1
    billed_total: "0"

- id: dev-04-phantom-billed-only
  note: A billed snapshot that no inventory can see and nobody declared.
  now: "2026-11-04T02:00:00Z"
  ledgers:
    intended: []
    observed: []
    billed: [{row: b1, key: "arn:aws:ec2:eu-north-1:111122223333:snapshot/snap-09ab", amount: "6.40"}]
  expect:
    regions: {snap-09ab: B}
    findings: 1
    billed_total: "6.40"

- id: dev-05-skeleton-declared-trail-missing
  note: The audit trail is declared in the template but no longer exists.
  now: "2026-11-04T02:00:00Z"
  ledgers:
    intended: [{row: i1, key: "org-audit-trail"}, {row: i2, key: "i-0aa1"}]
    observed: [{row: o1, key: "i-0aa1", ts: "2026-10-01T00:00:00Z"}]
    billed: [{row: b1, key: "arn:aws:ec2:us-east-1:111122223333:instance/i-0aa1", amount: "3.10"}]
