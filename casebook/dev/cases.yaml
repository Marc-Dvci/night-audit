- id: dev-06-wraith-approved-paid-unseen
  note: Approved and billed but not visible to the inventory (for example a region outside the observed scope).
  now: "2026-11-04T02:00:00Z"
  ledgers:
    intended: [{row: i1, key: "db-reporting"}]
    observed: []
    billed: [{row: b1, key: "arn:aws:rds:eu-west-3:111122223333:db:db-reporting", amount: "12.00"}]
  expect:
    regions: {db-reporting: IB}
    findings: 1
    billed_total: "12.00"

- id: dev-07-grace-window-pending
  note: Created 3 hours before the run. Billing has not caught up, so it is pending, not a vampire.
  now: "2026-11-04T02:00:00Z"
  ledgers:
    intended: [{row: i1, key: "i-0aa1"}]
    observed: [{row: o1, key: "i-0aa1", ts: "2026-11-03T23:00:00Z"}]
    billed: []
  expect:
    regions: {}
    pending: [i-0aa1]
    findings: 0
    billed_total: "0"

- id: dev-08-grace-window-expired
  note: Same as dev-07 but 30 hours old. Still unbilled, approved and present, so it is a familiar (informational).
  now: "2026-11-04T02:00:00Z"
  ledgers:
    intended: [{row: i1, key: "i-0aa1"}]
    observed: [{row: o1, key: "i-0aa1", ts: "2026-11-02T20:00:00Z"}]
    billed: []
  expect:
    regions: {i-0aa1: IO}
    findings: 0
    informational: 1
    billed_total: "0"

- id: dev-09-normalisation-case-and-space
  note: The same instance written three ways must match.
  now: "2026-11-04T02:00:00Z"
  ledgers:
    intended: [{row: i1, key: "  I-0AA1 "}]
    observed: [{row: o1, key: "i-0aa1", ts: "2026-10-01T00:00:00Z"}]
    billed: [{row: b1, key: "arn:aws:ec2:us-east-1:111122223333:instance/I-0AA1", amount: "3.10"}]
  expect:
    regions: {i-0aa1: IOB}
    findings: 0
