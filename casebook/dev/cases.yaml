  ledgers:
    intended: [{row: hr1, key: "ana.ruiz@hollowpines.com"}]
    observed: [{row: idp1, key: "Ana.Ruiz@hollowpines.com", ts: "2025-01-10T00:00:00Z"}, {row: idp2, key: "j.marsh@hollowpines.com", ts: "2024-05-02T00:00:00Z"}]
    billed: [{row: seat1, key: "ana.ruiz@hollowpines.com", amount: "12.00"}, {row: seat2, key: "j.marsh@hollowpines.com", amount: "12.00"}]
  expect:
    regions: {ana.ruiz@hollowpines.com: IOB, j.marsh@hollowpines.com: OB}
    findings: 1
    billed_total: "24.00"

