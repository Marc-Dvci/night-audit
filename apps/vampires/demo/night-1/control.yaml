# Demo control: a synthetic account (111122223333) over three nights. Runs with no AWS access.
id: demo-account
title: Demo account 111122223333
app: vampires
grace_hours: 36
ledgers:
  intended:
    key_field: id
    normalisers: [arn_resource_id, strip, lower]
    connector: {type: csv, path: intended.csv}
  observed:
    key_field: id
    normalisers: [arn_resource_id, strip, lower]
    connector: {type: csv, path: observed.csv}
  billed:
    key_field: resource
    normalisers: [arn_resource_id, strip, lower]
    connector: {type: csv, path: billed.csv}
regions:
  OB: {name: Vampire, meaning: "Running and on the bill, but in no declared stack and no approved change."}
  O: {name: Poltergeist, meaning: "Exists but was never declared. It costs nothing, which is why nobody notices it."}
  B: {name: Phantom, meaning: "On the bill, but the inventory cannot see it and nobody declared it."}
  I: {name: Skeleton, meaning: "Declared in a stack or an approved change, but gone and no longer billed."}
  IB: {name: Wraith, meaning: "Declared and billed, but the inventory cannot see it."}
  IO: {name: Familiar, meaning: "Declared and present, with no charge on the bill yet."}
ui:
  title: Vampires
  tagline: Every night, this AWS account is checked against what was declared and what is on the bill.
  noun: {singular: resource, plural: resources}
  ledgers:
    intended: {label: Declared, source: CloudFormation stacks and approved changes.}
    observed: {label: Running, source: Live inventory from read-only Describe and List calls.}
    billed: {label: Billed, source: Cost and Usage Report 2.0 line items.}
  columns:
    - {label: Finding, from: name}
    - {label: Resource, from: key}
    - {label: Kind, from: "attr:kind"}
    - {label: Region, from: "attr:region"}
    - {label: Since, from: status}
    - {label: On the bill, from: amount}
  headlines:
    OB:
      one: "{count} Vampire is running and on the bill with no approval: {amount} so far."
      other: "{count} Vampires are running and on the bill with no approval: {amount} so far."
    B:
      one: "{count} Phantom is on the bill, but nobody declared it and the inventory cannot see it: {amount}."
      other: "{count} Phantoms are on the bill, but nobody declared them and the inventory cannot see them: {amount}."
    IB:
      one: "{count} Wraith is declared and billed, but the inventory cannot see it: {amount}."
      other: "{count} Wraiths are declared and billed, but the inventory cannot see them: {amount}."
    I:
      one: "{count} declared {noun} is gone."
      other: "{count} declared {noun} are gone."
    O:
      one: "{count} Poltergeist costs nothing."
      other: "{count} Poltergeists cost nothing."
