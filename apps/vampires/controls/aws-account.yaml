# Night Audit control: one AWS account, three ledgers. Generic: nothing in this file belongs to one account.
# Account values (CUR bucket, account id, approver) come from settings.local.yaml or the environment; see
# settings.example.yaml.
# Intended = declared stacks + approved changes. Observed = live inventory. Billed = CUR 2.0.
id: aws-account
title: AWS account
app: vampires
grace_hours: 36
exclude_keys_file: exclusions.local.yaml
include_keys_file: scope.local.yaml

ledgers:
  intended:
    normalisers: [arn_resource_id, strip, lower]
    sources:
      - type: python
        entry: vampires.aws:DeclaredStacks
        options: {profile: night-audit}
      - type: python
        entry: vampires.aws:ApprovedChanges
        options: {path: approved-changes.yaml}
      - type: python
        entry: vampires.aws:ApprovedChanges
        options: {path: approved-changes.local.yaml, optional: true}
  observed:
    normalisers: [arn_resource_id, strip, lower]
    sources:
      - type: python
        entry: vampires.aws:Inventory
        options: {profile: night-audit}
  billed:
    normalisers: [arn_resource_id, strip, lower]
    sources:
      - type: python
        entry: vampires.aws:CostAndUsage
        options:
          profile: night-audit
          # bucket: comes from NIGHT_AUDIT_CUR_BUCKET (or NIGHT_AUDIT_ACCOUNT_ID) or settings.local.yaml; see
          # settings.example.yaml. Name it here only for a fixed bucket you are happy to publish.
          prefix: cur2
          export: night-audit-cur2

enrichers:
  - entry: vampires.aws:creating_events
    regions: [OB, O]
    options: {profile: night-audit, mask_source_ip: true}

regions:
  OB:
    label: Running and billed, never approved
    name: Vampire
    meaning: Running and on the bill, but in no declared stack and no approved change.
  O:
    label: Exists, never approved, free
    name: Poltergeist
    meaning: Exists but was never declared. It costs nothing, which is why nobody notices it.
  B:
    label: Billed, nothing to see
    name: Phantom
    meaning: On the bill, but the inventory cannot see it and nobody declared it.
  I:
    label: Approved, but gone
    name: Skeleton
    meaning: Declared in a stack or an approved change, but gone and no longer billed.
  IB:
    label: Approved and billed, not seen
    name: Wraith
    meaning: Declared and billed, but the inventory cannot see it.
  IO:
    label: Approved and present, not billed yet
    name: Familiar
    meaning: Declared and present, with no charge on the bill yet.

ui:
  title: Cloud account
  tagline: Every night, this AWS account is checked against what was declared and what is on the bill.
  noun: {singular: resource, plural: resources}
  ledgers:
    intended: {label: Declared, source: CloudFormation stacks and approved changes.}
    observed: {label: Running, source: Live inventory from read-only Describe and List calls.}
    billed: {label: Billed, source: Cost and Usage Report 2.0 line items.}
  columns:
    - {label: Finding, from: name}
    - {label: Resource, from: key}
    - {label: Kind, from: "attr:kind"}
    - {label: Region, from: "attr:region"}
    - {label: Created by, from: "context:created_by"}
    - {label: Since, from: status}
    - {label: On the bill, from: amount}
  headlines:
    OB:
      one: "{count} {noun} is running and on the bill with no approval: {amount} so far."
      other: "{count} {noun} are running and on the bill with no approval: {amount} so far."
    B:
      one: "{count} {noun} is billed, but nobody declared it or can see it: {amount}."
      other: "{count} {noun} are billed, but nobody declared them or can see them: {amount}."
    IB:
      one: "{count} approved {noun} is billed, but cannot be seen: {amount}."
      other: "{count} approved {noun} are billed, but cannot be seen: {amount}."
    I:
      one: "{count} approved {noun} is gone."
      other: "{count} approved {noun} are gone."
    O:
      one: "{count} {noun} exists with no approval and costs nothing."
      other: "{count} {noun} exist with no approval and cost nothing."
