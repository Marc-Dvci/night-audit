[project]
name = "vampires"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["nightaudit", "boto3>=1.35", "pyarrow>=17", "pyyaml>=6", "tzdata>=2024.1"]

[tool.uv.sources]
nightaudit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vampires"]
