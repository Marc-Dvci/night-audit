# Night Audit control: staff-access.yaml plus the members of a GitHub organisation as a second observed source (Req 3.2).
# Hollow Pines is a demo company, so this variant is a template for a real organisation:
#   1. set `org` to the organisation's login (the placeholder below is not a valid name and fails before any request);
#   2. export GITHUB_TOKEN with a fine-grained token that has only the organisation permission "Members: read";
#   3. give each engineer's login in the roster's github_login column.
# The connector only sends GET requests and refuses a classic token whose scopes allow writes.
id: staff-access-github
title: Hollow Pines Credit Union
app: ghosts
grace_hours: 72
alias_domains: {hollowpines.org: hollowpines.com}

ledgers:
  intended:
    normalisers: [email_canonical]
    sources:
      - type: python
        entry: ghosts.connectors:HrRoster
        options: {path: ../data/hr_roster.csv}
  observed:
    normalisers: [email_canonical]
    sources:
      - type: python
        entry: ghosts.connectors:IdentityExport
        options: {path: ../data/identity_export.csv, system: Hollow Pines directory}
      - type: python
        entry: ghosts.github:GitHubMembers
        options: {org: "<your-org>", token_env: GITHUB_TOKEN, roster: ../data/hr_roster.csv}
  billed:
    normalisers: [email_canonical]
    sources:
      - type: python
        entry: ghosts.connectors:SeatAssignments
        options: {vendor: Lantern Chat, assignments: ../data/licences/lantern-chat.csv,
                  invoice: ../data/invoices/lantern-chat.csv}
      - type: python
        entry: ghosts.connectors:SeatAssignments
        options: {vendor: Crypt Docs, assignments: ../data/licences/crypt-docs.csv,
                  invoice: ../data/invoices/crypt-docs.csv}
      - type: python
        entry: ghosts.connectors:SeatAssignments
        options: {vendor: Belfry CRM, assignments: ../data/licences/belfry-crm.csv,
                  invoice: ../data/invoices/belfry-crm.csv}
      - type: python
        entry: ghosts.connectors:SeatAssignments
        options: {vendor: Ossuary Design, assignments: ../data/licences/ossuary-design.csv,
                  invoice: ../data/invoices/ossuary-design.csv}

enrichers:
  - entry: ghosts.context:people_context
    regions: [OB, O, B, I, IB, IO]
    # The skeleton passes the control: the roster path is relative to this file and the alias table is the one above.
    options: {roster: ../data/hr_roster.csv}

summarisers:
  # Each vendor's invoice against its assignments, as run notes. Every number they cite is on a billed record.
  - entry: ghosts.seats:seat_notes

# Each template states the condition in words, from the HR facts the enricher added. Absent facts are empty text, and
# every number (a date) comes from the evidence.
regions:
  IOB:
    name: Living
    meaning: On the HR roster, with an active account and a paid seat.
  OB:
    label: Account and paid seat, not on staff
    name: Ghost
    meaning: Has an active account and a paid seat, but is not on the HR roster on the run date.
    template: "{context:hr_status} Account still active, last sign-in {context:last_sign_in_on}. {context:seats_held}."
  O:
    label: Account only, not on staff
    name: Poltergeist
    meaning: Has an active account, but is not on the HR roster and holds no paid seat.
    template: "{context:hr_status} Account active in {context:systems}, last sign-in {context:last_sign_in_on}. No paid seat."
  B:
    label: Paid seat, no account, not on staff
    name: Phantom seat
    meaning: A paid seat is assigned to an address with no active account and no HR record.
    template: "{context:hr_status} No active account. Seat paid for in {context:seats_in}."
  I:
    label: On staff, no account or seat yet
    name: Unprovisioned joiner
    meaning: On the HR roster, but has no active account and no paid seat.
    template: "{context:hr_status} No active account and no paid seat yet."
  IB:
    label: On staff, paid seat, no account
    name: Wraith
    meaning: On the HR roster with a paid seat, but has no active account.
    template: "{context:hr_status} Seat paid for in {context:seats_in}, but no active account."
  IO:
    label: On staff with account, no seat
    name: Unlicensed user
    meaning: On the HR roster with an active account and no paid seat. Informational.
    template: "{context:hr_status} Active account, last sign-in {context:last_sign_in_on}. No paid seat."

ui:
  title: Staff access
  tagline: Every night, the HR roster is checked against the accounts that exist and the seats that are paid for.
  noun: {singular: person, plural: people}
  unkeyed:
    singular: seat paid for nobody named
    plural: seats paid for nobody named
    explanation: The invoice counts more seats than there are assignments, so these seats have no person to match.
  downloads:
    - {label: Review sheet (CSV), file: review.csv}
    - {label: Review sheet (HTML), file: review.html}
  ledgers:
    intended: {label: HR roster, source: Employees and contractors HR lists on the run date.}
    observed: {label: Accounts, source: Active accounts in the identity export.}
    billed: {label: Paid seats, source: Licence assignments priced by each vendor's latest invoice.}
  columns:
    - {label: Person, from: key}
    - {label: Region, from: name}
    - {label: Systems, from: "context:systems"}
    - {label: Seats, from: "context:seats"}
    - {label: Left on, from: "context:left_on"}
    - {label: Last sign-in, from: "context:last_sign_in_on"}
    - {label: Manager, from: "context:manager"}
  headlines:
    OB:
      one: "{count} {noun} has an active account and a paid seat but is not on the HR roster: {amount} a month."
      other: "{count} {noun} have active accounts and paid seats but are not on the HR roster: {amount} a month."
    B:
      one: "{count} address with no account and no HR record has a paid seat: {amount} a month."
      other: "{count} addresses with no account and no HR record have paid seats: {amount} a month."
    IB:
      one: "{count} {noun} on the HR roster has a paid seat but no active account: {amount} a month."
      other: "{count} {noun} on the HR roster have paid seats but no active account: {amount} a month."
    I:
      one: "{count} {noun} on the HR roster has no account and no seat yet."
      other: "{count} {noun} on the HR roster have no account and no seat yet."
    O:
      one: "{count} active account has no HR record and no seat."
      other: "{count} active accounts have no HR record and no seat."
